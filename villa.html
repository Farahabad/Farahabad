<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png"><title>جزئیات اقامتگاه | farahabad.ir</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><a href="index.html" class="logo"><img src="logo.png" alt="farahabad.ir">farahabad.ir</a><a href="index.html" class="muted">← بازگشت به لیست</a></header>
<div class="container" id="app"></div>
<footer><a href="about.html" style="color:#2c4a5a;font-weight:600">درباره ما</a><br>© farahabad.ir</footer>
<script src="villas-data.js"></script>
<script src="jcal.js"></script>
<script>
const fmt = n => n.toLocaleString("fa-IR");
const v = VILLAS.find(x=>x.id==new URLSearchParams(location.search).get("id"));
const app = document.getElementById("app");
if(!v){ app.innerHTML="<p>اقامتگاه پیدا نشد.</p>"; }
else {
  document.title = v.title + " | farahabad.ir";
  const AMI={"استخر":"🏊","جکوزی":"♨️","پارکینگ":"🅿️","اسپیکر":"🔊","فوتبال دستی":"⚽","بیلیارد":"🎱","باربیکیو":"🍖","آلاچیق":"⛺","توالت فرنگی":"🚽","توالت ایرانی":"🚻"};
  var slides = v.gallery && v.gallery.length ? v.gallery : (v.img ? [v.img] : []);
  app.innerHTML = `
  <div class="detail">
    <div>
      ${slides.length>1?`<div class="carousel" style="background:${v.color}"><div class="car-track" id="carTrack">${slides.map((g,i)=>`<img src="${g}" alt="${v.title} - ${fmt(i+1)}" data-i="${i}" ${i?'loading="lazy"':""}>`).join("")}</div><div class="car-count" id="carCount">${fmt(1)} / ${fmt(slides.length)}</div><button type="button" class="car-nav car-next" id="carNext" aria-label="بعدی">‹</button><button type="button" class="car-nav car-prev" id="carPrev" aria-label="قبلی">›</button></div>`:`<div class="thumb" style="background:${v.color}">${v.img?`<img src="${v.img}" alt="${v.title}">`:v.emoji}</div>`}
      <h1 class="vtitle" style="margin-top:12px">${v.title}</h1>
      <p class="muted">${v.city} · ${v.type} · ⭐ ${fmt(v.rating)} (${fmt(v.reviews)} نظر)</p>
      <div class="box"><h3>درباره این اقامتگاه</h3><p style="white-space:pre-line">${v.desc}</p>
        ${v.hideSpec?"":`<p class="spec">${v.rooms===1?"تک":fmt(v.rooms)} خواب${v.capacity?` · ظرفیت ${fmt(v.capacity)} نفر`:""}</p>`}</div>
      ${v.gallery?`<div class="box"><h3>تصاویر</h3><div class="gal">${v.gallery.map((g,i)=>`<img src="${g}" alt="" data-i="${i}" loading="lazy">`).join("")}</div></div>`:""}
      <div class="box"><h3>امکانات</h3><div class="amen">${v.amenities.map(a=>`<div class="am"><span class="am-i" aria-hidden="true">${AMI[a]||"✔️"}</span><span>${a}</span></div>`).join("")}</div></div>
      ${v.lat&&v.lng?`<div class="box"><h3>موقعیت مکانی</h3><div id="mapprev" style="position:relative;cursor:pointer;border-radius:10px;overflow:hidden;height:260px;background:#eee"><iframe tabindex="-1" style="position:absolute;inset:-10% 0 0 -10%;width:120%;height:120%;border:0;pointer-events:none" src="" data-src=""></iframe><div style="position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(40,120,220,.25);border:3px solid rgba(40,120,220,.8)"></div><div class="map-pin" aria-hidden="true">📍</div><div style="position:absolute;inset:0"></div></div><p class="muted">موقعیت تقریبی است. برای مشاهده لوکیشن دقیق روی نقشه کلیک کنید.</p><a class="navbtn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${v.lat},${v.lng}">🧭 مسیریابی</a></div>`:v.mapUrl?`<div class="box"><h3>موقعیت روی نقشه</h3><a class="sm" target="_blank" rel="noopener" href="${v.mapUrl}">📍 نمایش روی نقشه</a></div>`:""}
      <div class="box"><h3>قوانین</h3><p class="muted">ساعت ورود ۱۴ و خروج ۱۲</p></div>
    </div>
    <aside class="box booking" id="sheet">
      <div class="sheet-head" id="sheetHead"><i></i><button type="button" class="sheet-x" id="sheetX" aria-label="بستن">✕</button></div>
      <h3>درخواست رزرو</h3>
      <div class="row"><label class="muted">تاریخ ورود</label><input id="in" readonly></div>
      <div class="row"><label class="muted">تاریخ خروج</label><input id="out" readonly></div>
      <div class="row"><label class="muted">تعداد نفرات</label><input type="number" id="g" min="1" ${v.capacity?`max="${v.capacity}"`:""}></div>
      <div class="row"><label class="muted">نام و نام خانوادگی</label><input id="name"></div>
      <div class="row"><label class="muted">شماره موبایل</label><input id="phone" type="tel"></div>
      <div class="total" id="total"></div>
      <button style="width:100%" onclick="send()">ثبت درخواست رزرو</button>
      <div class="contact" id="contact" hidden></div>
      <p class="note">پرداخت آنلاین وجود ندارد. درخواست شما برای میزبان ارسال می‌شود و پس از تأیید، هماهنگی پرداخت از طریق تماس انجام می‌شود.</p>
    </aside>
  </div>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="bookbar" id="bookbar" hidden>
    <div class="bb-info"><b>${v.priceText||v.title}</b><span class="muted">⭐ ${fmt(v.rating)} · ${v.city}</span></div>
    <button type="button" id="bbBtn">درخواست رزرو</button>
  </div>`;
  const bar=document.getElementById("bookbar"), sheet=document.getElementById("sheet"), sbg=document.getElementById("sheetBg");
  const mq=window.matchMedia("(max-width:760px)");
  function openSheet(){ if(!mq.matches){ sheet.scrollIntoView({behavior:"smooth",block:"start"}); return; } sheet.style.transform=""; sheet.classList.add("open"); sbg.classList.add("on"); }
  function closeSheet(){ sheet.classList.remove("open"); sheet.style.transform=""; sbg.classList.remove("on"); }
  document.getElementById("bbBtn").onclick=openSheet;
  document.getElementById("sheetX").onclick=closeSheet;
  sbg.onclick=closeSheet;
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheet.classList.contains("open")&&document.getElementById("lb").hidden) closeSheet(); });
  mq.addEventListener&&mq.addEventListener("change",closeSheet);
  (function(){ /* کشیدن سربرگ به پایین = بستن */
    const h=document.getElementById("sheetHead"); let y0=null,dy=0;
    h.addEventListener("touchstart",e=>{ y0=e.touches[0].clientY; dy=0; sheet.style.transition="none"; },{passive:true});
    h.addEventListener("touchmove",e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); sheet.style.transform="translateY("+dy+"px)"; },{passive:true});
    h.addEventListener("touchend",()=>{ if(y0===null) return; y0=null; sheet.style.transition=""; if(dy>90) closeSheet(); else sheet.style.transform=""; });
  })();
  /* بدون قفل کردن body: لمس پس‌زمینه و پنجره‌ی کوتاه صفحه‌ی زیر را نمی‌کشد */
  sbg.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
  sheet.addEventListener("touchmove",e=>{ if(sheet.scrollHeight<=sheet.clientHeight+1 && !e.target.closest("input,select,textarea")) e.preventDefault(); },{passive:false});
  bar.classList.add("show");
  bar.hidden=false;
  if(v.lat&&v.lng){
    const ap=[v.lat+0.0012,v.lng-0.0015];
    const d=0.01,bb=[ap[1]-d,ap[0]-d,ap[1]+d,ap[0]+d].join("%2C");
    const pv=document.querySelector("#mapprev iframe");
    pv.src=`https://www.openstreetmap.org/export/embed.html?bbox=${bb}&layer=mapnik`;
    document.getElementById("mapprev").onclick=()=>{
      const d2=0.004,b2=[v.lng-d2,v.lat-d2,v.lng+d2,v.lat+d2].join("%2C");
      const m=document.createElement("div");
      m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px";
      m.innerHTML=`<iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${b2}&layer=mapnik&marker=${v.lat}%2C${v.lng}" style="width:100%;max-width:700px;height:70vh;border:0;border-radius:10px;background:#fff"></iframe>
      <a class="sm" target="_blank" rel="noopener" href="${v.mapUrl||`https://www.google.com/maps?q=${v.lat},${v.lng}`}">باز کردن در برنامه نقشه</a>
      <button type="button">بستن</button>`;
      m.querySelector("button").onclick=()=>m.remove();
      m.onclick=e=>{if(e.target===m)m.remove()};
      document.body.appendChild(m);
    };
  }
  const blockedJSON = JSON.stringify(v.blocked || []);
  document.getElementById("in").dataset.blocked = blockedJSON;
  document.getElementById("out").dataset.blocked = blockedJSON;
  jalaliPicker(document.getElementById("in"), calc);
  jalaliPicker(document.getElementById("out"), calc, () => {
    const i = document.getElementById("in").dataset.iso;
    return i ? toISO(addDays(fromISO(i), 1)) : null;
  });
}
function nights(){
  const a=fromISO(document.getElementById("in").dataset.iso||"2000-01-01"), b=fromISO(document.getElementById("out").dataset.iso||"2000-01-02");
  return Math.round((b-a)/86400000);
}
function calc(){
  const n=nights();
  document.getElementById("total").textContent = "";
}
function send(){
  const n=nights(), name=document.getElementById("name").value.trim(), phone=document.getElementById("phone").value.trim();
  if(!(n>0)||!name||!phone){ alert("لطفا تاریخ‌ها (خروج بعد از ورود)، نام و شماره موبایل را وارد کنید."); return; }
  const inV=document.getElementById("in").value, outV=document.getElementById("out").value, g=document.getElementById("g").value;
  const msg=`درخواست رزرو\nاقامتگاه: ${v.title}\nورود: ${inV}\nخروج: ${outV}\n(${fmt(n)} شب)\nتعداد نفرات: ${g}\nنام: ${name}\nموبایل: ${phone}`;
  const e=encodeURIComponent(msg);
  let h=`<a class="wa" href="https://wa.me/${OWNER.phone}?text=${e}" target="_blank">ارسال به واتساپ</a>`;
  if(OWNER.telegram) h+=`<a class="tg" href="https://t.me/${OWNER.telegram}?text=${e}" target="_blank">ارسال به تلگرام</a>`;
  h+=`<a class="sm" href="sms:+${OWNER.phone}?body=${e}">ارسال پیامک</a>`;
  h+=`<a class="sm" href="#" id="cp">کپی متن پیام (اگر پیامک باز نشد)</a>`;
  const c=document.getElementById("contact"); c.innerHTML="<p class='muted'>برای تکمیل ثبت، یکی از راه‌ها را بزنید تا درخواست برای میزبان ارسال شود:</p>"+h; c.hidden=false;
  document.getElementById("cp").onclick=function(ev){ev.preventDefault();
    const done=()=>{this.textContent="کپی شد ✓ — در برنامه پیامک‌ها paste کنید";};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(done,()=>prompt("متن را کپی کنید:",msg));
    else prompt("متن را کپی کنید:",msg);
  };
}
</script>
</body>
</html>
<div id="lb" class="lb" hidden>
  <button class="lb-x" aria-label="بستن">✕</button>
  <div class="lb-count" id="lbCount"></div>
  <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="بعدی">‹</button>
  <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="قبلی">›</button>
  <img id="lbImg" alt="">
</div>
<script>
(function(){
  if(typeof slides==="undefined"||!slides.length) return;
  const lb=document.getElementById("lb"), img=document.getElementById("lbImg"), cnt=document.getElementById("lbCount");
  const track=document.getElementById("carTrack"), carCount=document.getElementById("carCount");
  let cur=0;
  const N=slides.length, wrap=i=>(i+N)%N;

  /* ---- کاروسل صفحه ---- */
  function carIndex(){ return track? Math.min(N-1,Math.max(0,Math.round(Math.abs(track.scrollLeft)/track.clientWidth))):0; }
  function carGo(i,smooth){
    if(!track) return; i=wrap(i);
    const w=track.clientWidth, rtl=getComputedStyle(track).direction==="rtl";
    track.scrollTo({left:(rtl?-1:1)*i*w, behavior:smooth?"smooth":"auto"});
  }
  if(track){
    let t;
    track.addEventListener("scroll",()=>{ clearTimeout(t); t=setTimeout(()=>{carCount.textContent=fmt(carIndex()+1)+" / "+fmt(N);},60); },{passive:true});
    document.getElementById("carNext").onclick=()=>carGo(carIndex()+1,true);
    document.getElementById("carPrev").onclick=()=>carGo(carIndex()-1,true);
  }

  /* ---- نمایش تمام‌صفحه ---- */
  function show(i){
    cur=wrap(i); resetZoom(); img.src=slides[cur]; cnt.textContent=fmt(cur+1)+" / "+fmt(N);
    new Image().src=slides[wrap(cur+1)]; new Image().src=slides[wrap(cur-1)];
  }
  function open(i){ show(i); lb.hidden=false; }
  function close(){ lb.hidden=true; if(track) carGo(cur,false); }
  document.addEventListener("click",e=>{
    const t=e.target;
    if(t.dataset&&t.dataset.i!==undefined&&!lb.contains(t)){ open(+t.dataset.i); return; }
    if(lb.hidden||!lb.contains(t)) return;
    if(t.closest("#lbNext")) show(cur+1);
    else if(t.closest("#lbPrev")) show(cur-1);
    else if(t.closest(".lb-x")||t===lb) close();
  });
  document.addEventListener("keydown",e=>{
    if(lb.hidden) return;
    if(e.key==="Escape") close();
    else if(e.key==="ArrowLeft") show(cur+1);
    else if(e.key==="ArrowRight") show(cur-1);
  });
  /* کشیدن انگشت: در راست‌به‌چپ، کشیدن به راست = عکس بعدی. دو انگشت = زوم. دو بار لمس = زوم/بازگشت */
  let sc=1,tx=0,ty=0,mode=null,x0=0,y0=0,d0=0,s0=1,tx0=0,ty0=0,lastTap=0,moved=false;
  const apply=()=>{ img.style.transform=sc===1?"":`translate(${tx}px,${ty}px) scale(${sc})`; };
  function resetZoom(){ sc=1;tx=0;ty=0;apply(); }
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  lb.addEventListener("touchstart",e=>{
    moved=false;
    if(e.touches.length>1){ mode="pinch"; d0=dist(e.touches); s0=sc; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; tx0=tx; ty0=ty;
    mode=sc>1?"pan":"swipe";
  },{passive:true});
  lb.addEventListener("touchmove",e=>{
    if(mode==="pinch"&&e.touches.length>1){ sc=Math.min(4,Math.max(1,s0*dist(e.touches)/d0)); moved=true; apply(); e.preventDefault(); }
    else if(mode==="pan"&&e.touches.length===1){ tx=tx0+e.touches[0].clientX-x0; ty=ty0+e.touches[0].clientY-y0; moved=true; apply(); e.preventDefault(); }
  },{passive:false});
  lb.addEventListener("touchend",e=>{
    if(e.touches.length) return;
    const m=mode; mode=null;
    if(sc<1.05) resetZoom();
    if(m==="pinch") return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(m==="pan"){ if(Math.abs(dx)<8&&Math.abs(dy)<8) dbl(); return; }
    if(m!=="swipe") return;
    if(Math.abs(dx)<8&&Math.abs(dy)<8){ if(e.target===img) dbl(); return; }
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){ show(dx>0?cur+1:cur-1); }
    else if(dy>90&&Math.abs(dy)>Math.abs(dx)*1.5){ close(); }
  },{passive:true});
  function dbl(){ const n=Date.now(); if(n-lastTap<300){ if(sc>1) resetZoom(); else { sc=2.5; tx=0; ty=0; apply(); } lastTap=0; } else lastTap=n; }
  img.addEventListener("dblclick",()=>{ if(sc>1) resetZoom(); else { sc=2.5; apply(); } });
})();
</script>
