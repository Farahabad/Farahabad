<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png"><title>فرح‌آباد | اجاره ویلا در فرح‌آباد و ساری</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><a href="index.html" class="logo"><img src="logo.png" alt="farahabad.ir">farahabad.ir</a><span class="muted">اجاره ویلا در شمال</span></header>

<section class="hero">
  <h1>اجاره ویلا در فرح‌آباد و اطراف ساری</h1>
  <p>ویلا، سوئیت و کلبه با بهترین قیمت</p>
  <div class="search">
    <div><label>شهر</label>
      <select id="city"><option value="">همه</option><option value="فرح‌آباد">فرح‌آباد</option><option>ساری</option></select></div>
    <div><label>جستجوی نام</label><input id="q" placeholder="مثلا استخر"></div>
    <div><label>تعداد نفرات</label><input type="text" inputmode="numeric" id="guests" placeholder="مثلا 6"></div>
    <div style="align-self:end"><button onclick="render()" style="width:100%">جستجو</button></div>
  </div>
  <div class="scene">
    <svg viewBox="0 700 1220 275" aria-hidden="true">
    <!-- ساحل، ویلا، استخر، نخل، چتر، قایق و امواج -->
    <g>
      <!-- خط افق ساحل -->
      <path d="M0 880 H1220" style="stroke-opacity:.3"/>
      <!-- ویلا -->
      <path d="M120 800 L200 730 L280 800"/>
      <path d="M130 800 H270 V880 H130 Z"/>
      <path d="M185 820 H215 V880 H185 Z"/>
      <rect x="145" y="820" width="26" height="26"/>
      <rect x="229" y="820" width="26" height="26"/>
      <path d="M240 762 V728 H258 V770"/>
      <!-- استخر -->
      <rect x="330" y="850" width="260" height="30" rx="4"/>
      <path d="M330 866 q16 -8 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0"/>
      <!-- نخل -->
      <path d="M650 880 Q662 800 640 720"/>
      <path d="M640 720 q-50 -30 -90 0"/>
      <path d="M640 720 q50 -30 90 0"/>
      <path d="M640 720 q-30 -45 10 -60"/>
      <path d="M640 720 q30 -45 -10 -60"/>
      <path d="M640 720 q-60 -5 -70 30"/>
      <path d="M640 720 q60 -5 70 30"/>
      <circle cx="636" cy="728" r="6"/>
      <circle cx="648" cy="730" r="6"/>
      <!-- چتر و صندلی ساحلی -->
      <path d="M730 772 Q770 716 810 772 Z"/>
      <path d="M770 716 V880"/>
      <path d="M822 862 H866"/>
      <path d="M822 862 V828"/>
      <path d="M828 862 V880 M860 862 V880"/>
      <!-- قایق -->
      <path d="M960 858 H1090 L1068 882 H984 Z"/>
      <path d="M1030 858 V770"/>
      <path d="M1030 780 Q1070 820 1080 856 H1030 Z"/>
      <path d="M1030 780 Q996 820 990 856 H1030 Z"/>
      <!-- امواج دریا -->
      <path d="M0 910 q40 -16 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" style="stroke-opacity:.5"/>
      <path d="M0 950 q40 -16 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" style="stroke-opacity:.3"/>
    </g>
  </svg>
  </div>
</section>

<div class="container layout">
  <aside class="filters">
    <h3>فیلتر</h3>
    <div class="row"><label class="muted">نوع اقامتگاه</label>
      <select id="type"><option value="">همه</option><option>ویلا</option><option>سوئیت</option><option>کلبه</option></select></div>
    <div class="row"><label class="chk"><input type="checkbox" id="pool"> استخر دارد</label></div>
    <div class="row"><label class="muted">مرتب‌سازی</label>
      <select id="sort"><option value="">پیش‌فرض</option><option value="rate">بیشترین امتیاز</option></select></div>
    <button onclick="render()" style="width:100%">اعمال فیلتر</button>
  </aside>
  <main>
    <p class="muted" id="count" style="margin-bottom:10px"></p>
    <div class="grid" id="list"></div>
  </main>
</div>

<footer><a href="about.html" style="color:#2c4a5a;font-weight:600">درباره ما</a><br>© farahabad.ir - همه حقوق محفوظ است</footer>

<script src="villas-data.js"></script>
<script>
const fmt = n => n.toLocaleString("fa-IR");
const nd = s => String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632);
const norm = s => String(s).replace(/\u064A/g,"ی").replace(/\u0643/g,"ک").replace(/[\u200c\s]/g,"");
function render(){
  const city=document.getElementById("city").value, type=document.getElementById("type").value;
  const guests=+nd(document.getElementById("guests").value)||0, q=norm(document.getElementById("q").value);
  const pool=document.getElementById("pool").checked, sort=document.getElementById("sort").value;
  let r=VILLAS.filter(v=>(!city||norm(v.city)===norm(city))&&(!type||v.type===type)&&(!q||norm(v.title+v.city+v.type+v.desc+v.amenities.join("")).includes(q))&&(!v.capacity||v.capacity>=guests)&&(!pool||v.amenities.includes("استخر")));
  if(sort==="rate")r.sort((a,b)=>b.rating-a.rating);
  document.getElementById("count").textContent=fmt(r.length)+" اقامتگاه یافت شد";
  document.getElementById("list").innerHTML=r.map(v=>`
    <a class="card" href="villa.html?id=${v.id}">
      <div class="thumb" style="background:${v.color}">${v.img?`<img src="${v.img}" alt="${v.title}">`:v.emoji}</div>
      <div class="info"><h3>${v.title}</h3>
        <div class="muted">${v.city} · ${v.rooms===1?"تک":fmt(v.rooms)} خواب${v.capacity?` · تا ${fmt(v.capacity)} نفر`:""}</div>
        ${v.priceText?`<div class="muted"><b>${v.priceText}</b></div>`:""}
        <div class="muted">⭐ ${fmt(v.rating)} (${fmt(v.reviews)} نظر)</div>
</div>
    </a>`).join("")||"<p>موردی یافت نشد.</p>";
}
document.querySelectorAll("select,input").forEach(e=>e.addEventListener(e.tagName==="SELECT"||e.type==="checkbox"?"change":"input",render));
render();
</script>
</body>
</html>
